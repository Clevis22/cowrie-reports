name: Publish report site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'reports/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-build.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'reports/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-build.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-report-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Markdown build tools
        run: python -m pip install -r requirements-build.txt
      - name: Check the renderer
        run: python -m unittest discover -s tests -q
      - name: Build reports and archive
        run: python scripts/build_site.py
      - name: Upload public site only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
