<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#272e33">
    <meta name="description" content="$description">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
    <title>$title · Cowrie reports</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../style.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
      <header class="site-header">
        <a class="wordmark" href="../../" aria-label="Cowrie reports home">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M5 6h14v12H5zM8 10l2 2-2 2m5 0h3"/></svg>
          <span>cowrie<span class="wordmark-divider"> / </span>reports</span>
        </a>
        <nav aria-label="Main navigation"><a href="../../#reports">Reports</a><a href="../../#about">About</a></nav>
      </header>
      <main id="main">
        <article class="report">
          <header class="report-header">
            <a class="back-link" href="../../#reports">← All reports</a>
            <p class="report-meta"><time datetime="$date">$display_date</time><span>UTC</span><span>By $author</span></p>
            <h1>$title</h1>
            $summary
          </header>
          <div class="report-body">$body</div>
          <footer class="report-source"><a href="../$date.md">Read the Markdown</a></footer>
        </article>
      </main>
      <footer class="site-footer"><a href="../../">Cowrie reports</a><a href="https://github.com/sainnhe/everforest" rel="noreferrer">Everforest palette ↗</a></footer>
    </div>
  </body>
</html>
